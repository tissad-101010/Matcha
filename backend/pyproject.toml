[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matcha-backend"
version = "0.1.0"
description = "Matcha JSON API and real-time server"
requires-python = ">=3.12,<3.14"
dependencies = [
    "argon2-cffi==25.1.0",
    "boto3==1.43.63",
    "Faker==40.36.0",
    "Flask==3.1.3",
    "Flask-Session==0.8.0",
    "Flask-SocketIO==5.6.1",
    "gevent==26.7.0",
    "gunicorn==26.0.0",
    "Pillow==12.3.0",
    "psycopg[binary,pool]==3.3.4",
    "python-dotenv==1.1.1",
    "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "ruff==0.16.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
